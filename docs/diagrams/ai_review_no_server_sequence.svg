<svg width="680" height="980" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" role="img">
<title>서버 없는 DTC 매핑 AI 검토 시퀀스 다이어그램</title>
<desc>작업 스케줄러가 예약된 시각에 로컬 Python 스크립트를 실행하면, Python이 매핑을 재계산하고 검토 컨텍스트를 만든 뒤 n8n Cloud의 Webhook으로 제안을 요청한다. n8n은 AI Agent 호출만 대행하고 결과를 동기 응답으로 돌려준다. Python이 그 응답을 리뷰 CSV에 반영하고, 성공 또는 실패 여부에 따라 Teams로 직접 알림을 보낸다. 사용자는 Teams 알림을 확인한 뒤, 제안이 맞다고 판단되면 config.json을 직접 수동으로 반영한다 -- 이 단계는 자동화되지 않는다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="980" fill="#ffffff"/>

<!-- lifelines -->
<line x1="92" y1="84" x2="92" y2="895" stroke="#888780" stroke-width="0.5"/>
<line x1="212" y1="84" x2="212" y2="895" stroke="#888780" stroke-width="0.5"/>
<line x1="332" y1="84" x2="332" y2="895" stroke="#888780" stroke-width="0.5"/>
<line x1="452" y1="84" x2="452" y2="895" stroke="#888780" stroke-width="0.5"/>
<line x1="572" y1="84" x2="572" y2="895" stroke="#888780" stroke-width="0.5"/>

<!-- top actor boxes -->
<g><rect x="40" y="40" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="92" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">작업 스케줄러</text></g>
<g><rect x="160" y="40" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="212" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Python</text></g>
<g><rect x="280" y="40" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="332" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">n8n</text></g>
<g><rect x="400" y="40" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="452" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Teams</text></g>
<g><rect x="520" y="40" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="572" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">사용자</text></g>

<!-- M1 -->
<text x="152" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">예약 실행</text>
<line x1="92" y1="140" x2="212" y2="140" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Loop2 -->
<text x="248" y="201" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">매핑 재계산</text>
<path d="M212,180 L242,180 L242,215 L212,215" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Loop3 -->
<text x="248" y="276" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">컨텍스트</text>
<path d="M212,255 L242,255 L242,290 L212,290" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M4 -->
<text x="272" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 요청</text>
<line x1="212" y1="340" x2="332" y2="340" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Loop5 -->
<text x="368" y="401" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 생성</text>
<path d="M332,380 L362,380 L362,415 L332,415" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M6 dashed -->
<text x="272" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 응답</text>
<line x1="332" y1="465" x2="212" y2="465" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Loop7 -->
<text x="248" y="526" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">CSV 반영</text>
<path d="M212,505 L242,505 L242,540 L212,540" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- alt block -->
<rect x="180" y="575" width="300" height="160" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="180" y="575" width="46" height="20" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="203" y="589" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">alt</text>

<text x="345" y="618" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">성공 알림</text>
<line x1="212" y1="628" x2="452" y2="628" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="180" y1="673" x2="480" y2="673" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>

<text x="345" y="698" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">실패 알림</text>
<line x1="212" y1="708" x2="452" y2="708" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M final Teams -> 사용자 dashed -->
<text x="512" y="775" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">알림 확인</text>
<line x1="452" y1="785" x2="572" y2="785" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- Loop final: 사용자 self loop, bulges left -->
<text x="536" y="842" text-anchor="end" font-family="sans-serif" font-size="12" fill="#5F5E5A">수동 반영</text>
<path d="M572,825 L542,825 L542,860 L572,860" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- bottom actor boxes -->
<g><rect x="40" y="895" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="92" y="921" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">작업 스케줄러</text></g>
<g><rect x="160" y="895" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="212" y="921" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Python</text></g>
<g><rect x="280" y="895" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="332" y="921" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">n8n</text></g>
<g><rect x="400" y="895" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="452" y="921" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Teams</text></g>
<g><rect x="520" y="895" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="572" y="921" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">사용자</text></g>
</svg>
