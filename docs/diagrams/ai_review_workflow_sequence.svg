<svg width="680" height="894" viewBox="0 0 680 894" xmlns="http://www.w3.org/2000/svg" role="img">
<title>DTC 매핑 AI 검토 워크플로우 시퀀스 다이어그램</title>
<desc>사용자가 n8n을 수동으로 실행하면, n8n이 Python 도구로 매핑을 재생성하고 검토 컨텍스트를 만든 뒤, 시트별로 AI Agent에 매핑 제안을 요청한다. 제안을 반영한 뒤 성공 또는 실패 여부에 따라 Teams로 다른 메시지를 보내고, 사용자는 Teams 알림을 확인한다.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="894" fill="#ffffff"/>

<!-- lifelines -->
<line x1="92" y1="84" x2="92" y2="810" stroke="#888780" stroke-width="0.5"/>
<line x1="212" y1="84" x2="212" y2="810" stroke="#888780" stroke-width="0.5"/>
<line x1="332" y1="84" x2="332" y2="810" stroke="#888780" stroke-width="0.5"/>
<line x1="452" y1="84" x2="452" y2="810" stroke="#888780" stroke-width="0.5"/>
<line x1="572" y1="84" x2="572" y2="810" stroke="#888780" stroke-width="0.5"/>

<!-- top actor boxes -->
<g><rect x="40" y="40" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="92" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">사용자</text></g>
<g><rect x="160" y="40" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="212" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">n8n</text></g>
<g><rect x="280" y="40" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="332" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Python</text></g>
<g><rect x="400" y="40" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="452" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">AI Agent</text></g>
<g><rect x="520" y="40" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="572" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Teams</text></g>

<!-- M1 사용자 -> n8n -->
<text x="152" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">수동 실행</text>
<line x1="92" y1="140" x2="212" y2="140" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M2 n8n -> Python -->
<text x="272" y="185" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">매핑 재생성</text>
<line x1="212" y1="195" x2="332" y2="195" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M3 n8n -> Python -->
<text x="272" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">검토 컨텍스트</text>
<line x1="212" y1="250" x2="332" y2="250" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Loop4 n8n self loop -->
<text x="248" y="303" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">시트 분리</text>
<path d="M212,290 L242,290 L242,325 L212,325" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M5 n8n -> AI Agent -->
<text x="345" y="365" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 요청</text>
<line x1="212" y1="375" x2="452" y2="375" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Loop6 AI Agent self loop -->
<text x="488" y="428" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 생성</text>
<path d="M452,415 L482,415 L482,450 L452,450" fill="none" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M7 AI Agent -> n8n dashed -->
<text x="345" y="490" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 전달</text>
<line x1="452" y1="500" x2="212" y2="500" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- M8 n8n -> Python -->
<text x="272" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">제안 적용</text>
<line x1="212" y1="550" x2="332" y2="550" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- alt block -->
<rect x="180" y="572" width="420" height="160" fill="none" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="180" y="572" width="46" height="20" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="203" y="586" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">alt</text>

<text x="392" y="615" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">성공 알림</text>
<line x1="212" y1="625" x2="572" y2="625" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="180" y1="670" x2="600" y2="670" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>

<text x="392" y="695" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">실패 알림</text>
<line x1="212" y1="705" x2="572" y2="705" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- M9 Teams -> 사용자 dashed -->
<text x="345" y="770" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">알림 확인</text>
<line x1="572" y1="780" x2="92" y2="780" stroke="#2C2C2A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<!-- bottom actor boxes -->
<g><rect x="40" y="810" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="92" y="836" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">사용자</text></g>
<g><rect x="160" y="810" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="212" y="836" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">n8n</text></g>
<g><rect x="280" y="810" width="104" height="44" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="332" y="836" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Python</text></g>
<g><rect x="400" y="810" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="452" y="836" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">AI Agent</text></g>
<g><rect x="520" y="810" width="104" height="44" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="572" y="836" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Teams</text></g>
</svg>
